[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "flet>=0.80.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "websockets>=15.0.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["main_app", "user_app"]

[tool.mypy]
# Указываем Mypy использовать Python из твоего виртуального окружения
python_executable = ".venv/bin/python"
# Игнорируем проверки внутри папки окружения, чтобы не тратить ресурсы
exclude = ["^\\.venv/"]

[dependency-groups]
dev = ["types-aiofiles>=25.1.0.20251011"]
